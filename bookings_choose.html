<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wybierz apartament</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/.vscode/styles.css">
  <style>
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #e6eefb}
    .user-info{display:flex;align-items:center;gap:12px;font-size:14px}
    .logout-btn{background:#dc2626;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
    .logout-btn:hover{background:#b91c1c}
    .session-timer{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;background:#eef3ff;color:#1a3a7b;border:1px solid #c7d4ff;font-size:12px;font-weight:600}
    .box{background:#fff;padding:28px;border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,0.06);max-width:520px;width:100%}
    .list{display:flex;gap:12px}
    a.card{flex:1;padding:14px;border-radius:8px;text-decoration:none;color:#0b1f3a;background:#f8fafc;border:1px solid #e6eefb;display:block;text-align:center}
    a.card:hover{box-shadow:0 6px 18px rgba(2,6,23,0.06)}
    .bookings{margin-top:10px;font-size:13px}
    .bookings table{width:100%;border-collapse:collapse;font-size:13px}
    .bookings th,.bookings td{padding:6px 8px;border:1px solid #d1d5db;text-align:left}
    .bookings th{background:#f3f4f6;color:#111;font-weight:600}
    .bookings .no-bookings{padding:10px;text-align:center;color:#4b5563;background:#f9fafb;border-radius:8px}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 style="margin:0">Wybierz apartament do rezerwacji</h1>
      <div class="user-info">
        <span>👤 <span id="userEmail">...</span></span>
        <span id="sessionTimer" class="session-timer">Sesja: --:--</span>
        <button class="logout-btn" onclick="logout()">Wyloguj</button>
      </div>
    </div>
    
    <div class="box" style="max-width:none">
      <div class="list">
        <a class="card" href="/booking/ap1/form" style="text-align:center;padding:18px;text-decoration:none;color:#0b1f3a;display:block">🏠 Apartament 1</a>
        <a class="card" href="/booking/ap2/form" style="text-align:center;padding:18px;text-decoration:none;color:#0b1f3a;display:block">🏠 Apartament 2</a>
      </div>

      <div style="margin-top:28px">
        <div style="display:flex;gap:20px;flex-wrap:wrap">
          <div style="flex:1;min-width:260px">
            <h2 style="margin:0 0 10px;font-size:16px">Rezerwacje: Apartament 1</h2>
            <div id="bookings1" class="bookings"></div>
          </div>
          <div style="flex:1;min-width:260px">
            <h2 style="margin:0 0 10px;font-size:16px">Rezerwacje: Apartament 2</h2>
            <div id="bookings2" class="bookings"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Licznik sesji - czas pobierany z serwera
    let sessionTimeLeft = 0; // zostanie ustawiony z API
    let sessionInterval;

    function updateSessionTimer() {
      const minutes = Math.floor(sessionTimeLeft / 60);
      const seconds = sessionTimeLeft % 60;
      const timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      document.getElementById('sessionTimer').textContent = `Sesja: ${timeString}`;
      
      if (sessionTimeLeft <= 0) {
        clearInterval(sessionInterval);
        alert('Sesja wygasła. Zostaniesz przekierowany na stronę logowania.');
        window.location.href = '/login.html';
      }
      sessionTimeLeft--;
    }

    function startSessionTimer() {
      updateSessionTimer(); // natychmiastowa aktualizacja
      sessionInterval = setInterval(updateSessionTimer, 1000);
    }

    // Załaduj informacje o zalogowanym użytkowniku
    async function loadUserInfo() {
      try {
        const response = await fetch('/api/user');
        const data = await response.json();
        if (data.logged) {
          document.getElementById('userEmail').textContent = data.email;
          // Ustaw czas sesji z serwera
          sessionTimeLeft = data.sessionTimeLeft || (15 * 60);
          startSessionTimer(); // uruchom licznik po potwierdzeniu logowania
          loadBookings();
        } else {
          window.location.href = '/login.html';
        }
      } catch (err) {
        console.error('Error loading user info:', err);
      }
    }

    // Wylogowanie
    function logout() {
      if (confirm('Czy na pewno chcesz się wylogować?')) {
        window.location.href = '/api/logout';
      }
    }

    function formatDateDDMMYY(ymd) {
      if (!ymd) return '';
      const datePart = ymd.split('T')[0];
      const parts = datePart.split('-');
      if (parts.length !== 3) return ymd;
      const [y, m, d] = parts;
      return `${d}-${m}-${y.slice(-2)}`;
    }

    function renderBookings(containerId, bookings) {
      const container = document.getElementById(containerId);
      if (!bookings || bookings.length === 0) {
        container.innerHTML = '<div class="no-bookings">Brak rezerwacji</div>';
        return;
      }

      const rows = bookings.map(b => {
        return `<tr><td>${formatDateDDMMYY(b.date_form)}</td><td>${formatDateDDMMYY(b.date_to)}</td><td>${b.name} ${b.surname}</td><td>${b.is_jacuzzi ? '✅' : ''}</td></tr>`;
      }).join('');

      container.innerHTML = `
        <table>
          <thead>
            <tr><th>Od</th><th>Do</th><th>Kto</th><th>Jacuzzi</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function loadBookings() {
      try {
        const [res1, res2] = await Promise.all([
          fetch('/api/bookings?apart=1'),
          fetch('/api/bookings?apart=2'),
        ]);

        const data1 = await res1.json();
        const data2 = await res2.json();

        renderBookings('bookings1', data1.bookings);
        renderBookings('bookings2', data2.bookings);
      } catch (err) {
        console.error('Error loading bookings:', err);
      }
    }

    loadUserInfo();
  </script>
</body>
</html>
