<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>System Rezerwacji Apartamentów</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--bg:#f6f8fa;--card:#ffffff;--accent:#0d6efd;--muted:#6b7280}
    *{box-sizing:border-box}
    body{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .container{text-align:center}
    h1{font-size:32px;color:#0f172a;margin:0 0 12px}
    p{color:var(--muted);font-size:16px;margin:0 0 24px}
    .spinner{width:40px;height:40px;border:4px solid #e6e9ef;border-top:4px solid var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="container">
    <h1>🏠 System Rezerwacji</h1>
    <p>Ładowanie...</p>
    <div class="spinner"></div>
  </div>

  <script>
    // Sprawdzenie statusu logowania i przekierowanie
    async function checkAuth() {
      try {
        const response = await fetch('/api/user');
        const data = await response.json();
        if (data.logged) {
          window.location.href = '/bookings/choose';
        } else {
          window.location.href = '/login.html';
        }
      } catch (err) {
        console.error('Error checking auth:', err);
        window.location.href = '/login.html';
      }
    }
    
    checkAuth();
  </script>
</body>
</html>
